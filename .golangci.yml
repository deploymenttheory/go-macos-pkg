version: "2"

run:
  timeout: 30m
  modules-download-mode: readonly
  allow-parallel-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        # G115: integer overflow conversions. Binary format code converts
        # between fixed-width fields constantly; each site is bounds-checked
        # where it matters and the linter cannot tell.
        - G115
        # G304: file inclusion via variable. A packaging tool opens the paths
        # it is told to open.
        - G304
        # G104 duplicates errcheck.
        - G104
        # G301/G302/G306: file and directory permissions. An extractor
        # recreates the modes the package recorded; 0755 directories are
        # the point, not an oversight.
        - G301
        - G302
        - G306
        # G401/G501/G505: SHA-1 and MD5. The xar format names them as
        # checksum algorithms and every package pkgbuild ships uses SHA-1
        # for its TOC digest; a reader has no choice. They are never used
        # for anything security-relevant here (signatures verify SHA-256).
        - G401
        - G501
        - G505
    errcheck:
      exclude-functions:
        # Diagnostics to stderr and stdout: nothing sensible can be done
        # when they fail, and the exit code already tells the story.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # Writing fixed-width integers into an in-memory buffer cannot fail.
        - encoding/binary.Write
        # Closing a file that was only read.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/deploymenttheory/go-macos-pkg/pkg/flatpkg.Package).Close
        - (*github.com/deploymenttheory/go-macos-pkg/pkg/xar.Reader).Close
    misspell:
      # No locale: Apple's attribute names (customize, ...) are American
      # and the prose is British; neither is a misspelling.
      ignore-rules:
        - customize
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # The acceptance harness runs the binary under test and the host's
      # tools as plain subprocesses; runTimeout is the one that carries a
      # deadline, deliberately.
      - path: ^acceptance/
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
